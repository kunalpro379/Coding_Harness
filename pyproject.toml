[project]
name = "cursor-agent-harness"
version = "0.1.0"
description = "Production-grade, enterprise Multi-Agent Coding Harness inspired by Cursor Agent"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "pydantic>=2.7.0",
    "pydantic-settings>=2.2.0",
    "openai>=1.20.0",
    "rich>=13.7.0",
    "typer>=0.12.0",
    "pyyaml>=6.0",
]

[project.scripts]
agent-harness = "harness.cli.main:run_cli"

[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"
